[workspace]
resolver = "2"
members = [
    "crates/oxi-events",
    "crates/decision-cli",
    "crates/product-cli",
    "crates/product-shim",
]

[workspace.package]
edition = "2021"
rust-version = "1.78"
license = "Apache-2.0"
repository = "https://github.com/Hafeok/decision-cli"

[workspace.dependencies]
# Substrate (oxi-events depends on these)
# rocksdb feature is disabled until FT-009 (orchestration store + persistence) lands.
# RocksDB requires libclang at build time; install via `sudo apt install libclang-dev cmake`
# and switch back to `default-features = true` when implementing on-disk persistence.
oxigraph = { version = "0.4", default-features = false }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Errors
thiserror = "1"
anyhow = "1"

# Hashing — embedded ontology + definition document content hashes
# (FT-006 / FT-008 record sha256 in the bootstrap session's PROV-O record).
sha2 = "0.10"

# Time and IDs
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# CLI (decision-cli only)
clap = { version = "4", features = ["derive"] }

# HTTP client (for subprocess + MCP wrappers in decision-cli)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# HTTP test plumbing (decision-cli dev-dependency only — exercises the
# axum router from inside-process tests via `tower::ServiceExt::oneshot`).
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"

# Internal
oxi-events = { path = "crates/oxi-events" }
product-cli = { path = "crates/product-cli" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Common allows for application code; oxi-events may want to be stricter
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
