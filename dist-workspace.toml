# cargo-dist workspace configuration for decision-cli.
#
# Re-scoped under FT-106 / ADR-077 (supersedes ADR-067). Source of truth
# for the GitHub Actions `release.yml` workflow that builds per-platform
# archives on every tag push. After editing this file, run `dist generate`
# to regenerate `.github/workflows/release.yml`.
#
# ADR-077 decision: decision-cli consumes product-core as a Cargo git
# dependency. No source vendoring, no subtree merge. This workspace ships
# one binary (`dec`) from one crate (`crates/decision-cli`). The
# standalone product-cli repo continues to publish its own `product`
# binary and `io.github.Hafeok/product-cli` MCP registry entry from its
# own release flow.
#
# Targets, installers, and hosting: five target triples (macOS arm64/x64,
# Linux arm64/x64, Windows x64), three installers (shell, powershell,
# homebrew), GitHub Releases hosting.

[workspace]
members = [
    "cargo:crates/decision-cli",
]

[dist]
# The preferred cargo-dist version to use in CI.
cargo-dist-version = "0.31.0"
# CI backends to support.
ci = "github"
# The installers to generate for each app.
installers = ["shell", "powershell", "homebrew"]
# Target platforms to build apps for (Rust target-triple).
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
# Path that installers should place binaries in.
install-path = "CARGO_HOME"
# Whether to install an updater program.
install-updater = false
# Publish jobs to run in CI.
pr-run-mode = "plan"
