[project]
name = "verify-graph-author"
version = "0.1.0"
description = "Python verify-graph-author worker for decision-cli's graph-proposal role (ADR-030, FT-048)."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
]

[project.scripts]
verify-graph-author = "verify_graph_author.__main__:main"

[project.optional-dependencies]
anthropic = ["anthropic>=0.34"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verify_graph_author"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.6",
]
