[project]
name = "pipeline-worker-sdk"
version = "0.1.0"
description = "Worker SDK: SSE/POST wire layer (FT-077), pyoxigraph session (FT-078), LiteLLM-backed capability-tag provider (FT-081)."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyoxigraph>=0.4",
    "litellm>=1.50",
    "instructor>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
codegen = "tools.codegen.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline_worker_sdk", "tools"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
