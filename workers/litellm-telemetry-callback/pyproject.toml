[project]
name = "litellm-telemetry-callback"
version = "0.1.0"
description = "LiteLLM custom callback that POSTs call telemetry to pipeline-cli's /llm-call-telemetry endpoint (FT-096 / ADR-064)."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "litellm>=1.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/litellm_telemetry_callback"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
