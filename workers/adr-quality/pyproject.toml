[project]
name = "adr-quality"
version = "0.1.0"
description = "Python adr-quality worker for decision-cli's ADR quality judge role (ADR-073, FT-133)."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "anthropic>=0.34",
]

[project.scripts]
adr-quality = "adr_quality.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adr_quality"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.6",
]
