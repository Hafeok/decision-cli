# config/capabilities.yaml — Seed `dec:Capability` catalog (FT-058 / ADR-036).
#
# Authoritative source for the initial catalog content. After bootstrap the
# graph is the source of truth; this file is documentation. Edit and re-run
# `scripts/bootstrap_catalog.py` to add new versions (bump `version` field);
# in-place edits without a version bump are rejected by the strict divergence
# handler.
#
# Schema mirrors FT-054's `dec:Capability` (see ADR-033 §schema):
#   capability_id, endpoint, model_identifier, tier, context_window, max_output,
#   supports_vision, supports_tool_calling, cost_input_per_m, cost_output_per_m,
#   cost_cache_hit_per_m (Anthropic only), cost_cache_write_5m (Anthropic only),
#   cost_currency, configurable_effort, exposes_reasoning_trace, status, version.
#
# Decimal fields are quoted so the YAML loader preserves exact lexical form
# (an unquoted `0.20` would collapse to `0.2`, which would fail divergence
# comparison on re-bootstrap).

capabilities:
  # --- Scaleway tier 1: cheap, fast classifier ------------------------------
  - capability_id: classifier
    endpoint: scaleway
    model_identifier: mistral-small-3.2-24b-instruct-2506
    context_window: 128000
    max_output: 8000
    supports_vision: false
    supports_tool_calling: true
    cost_input_per_m: "0.10"
    cost_output_per_m: "0.30"
    cost_currency: EUR
    configurable_effort: false
    exposes_reasoning_trace: false
    status: active
    version: 1

  # --- Scaleway tier 1: default implementer / verifier ---------------------
  - capability_id: code-writer
    endpoint: scaleway
    model_identifier: qwen3-coder-30b-a3b-instruct
    tier: 1
    context_window: 128000
    max_output: 32000
    supports_vision: false
    supports_tool_calling: true
    cost_input_per_m: "0.20"
    cost_output_per_m: "0.80"
    cost_currency: EUR
    configurable_effort: false
    exposes_reasoning_trace: false
    status: active
    version: 1

  # --- Scaleway tier 1: verify-graph-author (FT-068) ----------------------
  # Distinct capability id from `code-writer` so the init-time seed in
  # `core::role_catalog::verify_graph_author_seed_quads` never collides
  # with the YAML's `code-writer` row on `bootstrap_catalog.py` re-run.
  # v7: switched from devstral-2-123b (code-tuned, tier-2 cost) to
  # gpt-oss-120b (general-purpose open-weights, tier-1 cost). VGA's job
  # is structured graph-proposal generation under tool calling — parsing
  # TC frontmatter and emitting Turtle — which doesn't benefit from
  # code-specialised pre-training. gpt-oss-120b has 128k context and
  # native tool-calling per OpenAI's release; Scaleway hosts it on the
  # OpenAI-compatible serverless endpoint.
  - capability_id: verify-graph-author
    endpoint: scaleway
    model_identifier: gpt-oss-120b
    tier: 1
    context_window: 128000
    max_output: 16000
    supports_vision: false
    supports_tool_calling: true
    cost_input_per_m: "0.15"
    cost_output_per_m: "0.60"
    cost_currency: EUR
    configurable_effort: false
    exposes_reasoning_trace: false
    status: active
    version: 7

  # --- Scaleway tier 2: heavy code (devstral) ------------------------------
  - capability_id: code-writer-heavy
    endpoint: scaleway
    model_identifier: devstral-2-123b-instruct
    tier: 2
    context_window: 128000
