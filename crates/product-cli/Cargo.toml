[package]
name = "product-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Knowledge graph CLI for managing features, ADRs, and test criteria. Absorbed into the decision-cli workspace per FT-105 / ADR-067."

# FT-105 §SDP invariant: product-cli MUST NOT depend on decision-cli or
# oxi-events. The TC-179 fitness check asserts that this section never
# names either of them. Reverse direction (decision-cli → product-cli)
# is allowed and wired in `crates/decision-cli/Cargo.toml`.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }

[lints]
workspace = true
