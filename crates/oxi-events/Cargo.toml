[package]
name = "oxi-events"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0 OR MIT"
repository.workspace = true
description = "Graph-native event substrate for Oxigraph. SDP boundary — depends only on substrates more stable than itself."

[dependencies]
oxigraph = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# TC-011 drives the SSE endpoint through a real HTTP client so the
# delivery latency includes chunked-transfer framing and TCP delivery.
# Dev-deps only; runtime deps stay SDP-clean per ADR-001.
reqwest = { workspace = true, features = ["stream"] }
futures-util = "0.3"

[lints]
workspace = true
