# Cluster-routing config: feature_id → TaskType name.
# Read by FeatureShipPlanner::classify (FT-139 / ADR-080) when the
# feature_spec's front-matter doesn't carry `task_type:` (the common
# case until product-cli's parser accepts the field upstream).

[features]
"FT-145" = "add-cli-subcommand"
# FT-147 — first archetype-layer substrate FT. Rides add-artifact-type
# (FT-141) to emit dec:Archetype struct + SHACL + IRI vocab + parser +
# emitter + round-trip tests. First "non-prototype" use of the cluster
# pattern per FT-147's own §Description.
"FT-147" = "add-artifact-type"

# FT-148 — second archetype-layer substrate FT. Rides add-artifact-type
# through the hardened cluster (FT-170 placement, FT-171 per-cell retry,
# FT-172 compile + namespace audit).
"FT-148" = "add-artifact-type"

# FT-166 — per-feature parameter values consumed by cluster_dispatch
# when resolving cell output_paths. The add-artifact-type cluster's
# cells reference {artifact_name} in their templated paths.
[parameters."FT-147"]
artifact_name = "archetype"

[parameters."FT-148"]
artifact_name = "application_contract"
