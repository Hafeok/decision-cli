# Reusable release workflow for decision-cli workers (FT-089 / FT-091 / ADR-058 / ADR-059 / ADR-061).
#
# This workflow signs a worker OCI image keyless using cosign and the
# ambient GitHub Actions OIDC token, then records the resulting Sigstore
# Fulcio identity + Rekor transparency-log entry so the orchestration
# system's identity-verifier action (FT-090) can confirm:
#
#   1. signature validity,
#   2. signer identity is on the trust list (ADR-058),
#   3. Rekor log inclusion.
#
# It also generates a CycloneDX SBOM via syft and attaches it to the image
# as an OCI referrer per OCI v1.1 (FT-091 / ADR-059), so the WorkerCurator's
# bundle (FT-092) can name the SBOM and slice-3+ vulnerability gates can
# fetch it on demand without re-deriving it. The attached SBOM is
# discoverable via `cosign download sbom <image-ref>` and through the
# registry's referrers API at the image digest.
#
# The full release flow (build OCI multi-arch, push to registry, submit the
# WorkerImageSubmission) is the responsibility of FT-093 — this file owns
# the signing primitives + identity capture (FT-089) and SBOM generation +
# attachment (FT-091). FT-093's workflow file calls this one as a reusable
# workflow, passing the freshly-pushed image reference.
#
# How worker repos consume this workflow:
#
#   # In worker_repo/.github/workflows/release.yml
#   name: release
#   on:
#     push:
#       tags: ['implementer-v*.*.*']
#   jobs:
#     sign:
#       uses: Hafeok/decision-cli/.github/workflows/release-worker.yml@v1
#       permissions:
#         id-token: write   # required for keyless OIDC
#         contents: read
#         packages: write   # if pushing to ghcr
#       with:
#         image_ref: ghcr.io/example/worker@sha256:abc...
#
# What you get back as workflow outputs:
#   signature_subject — the Fulcio cert subject (workflow run identity)
#   signature_issuer  — the OIDC issuer URI
#   rekor_entry_uuid  — the Rekor log entry UUID
#   rekor_log_index   — the Rekor log index (integer)
#
# Trust-list entries (maintained inside the orchestration system per
# ADR-058) reference (repo, workflow_path, tag pattern) tuples. The
# workflow_path component for a reusable workflow invocation looks
# like `<owner>/<repo>/.github/workflows/release-worker.yml`; operators
# enrol the reusable-workflow path itself rather than each worker's
# trivial `release.yml` wrapper.

name: release-worker (reusable)

on:
  workflow_call:
    inputs:
      image_ref:
        description: >
          The OCI reference (with digest) of the pushed worker image to
          sign. Must include the @sha256:... digest so cosign signs the
          immutable bytes rather than a moving tag.
        required: true
        type: string
      rekor_url:
        description: >
          Rekor instance to publish to. Defaults to the public Sigstore
          instance (https://rekor.sigstore.dev) per ADR-058.
        required: false
        type: string
        default: https://rekor.sigstore.dev
      fulcio_url:
        description: >
          Fulcio CA to request a signing certificate from. Defaults to
          the public Sigstore instance per ADR-058.
        required: false
        type: string
        default: https://fulcio.sigstore.dev
      cosign_version:
        description: Cosign release tag to install.
        required: false
        type: string
        default: v2.4.0
      syft_version:
        description: Syft release tag to install for CycloneDX SBOM generation (FT-091 / ADR-059).
        required: false
        type: string
        default: v1.14.0
    outputs:
      signature_subject:
        description: Fulcio certificate subject (workflow run identity).
        value: ${{ jobs.sign.outputs.signature_subject }}
      signature_issuer:
        description: OIDC issuer URI used by cosign.
        value: ${{ jobs.sign.outputs.signature_issuer }}
      rekor_entry_uuid:
        description: Rekor transparency-log entry UUID.
        value: ${{ jobs.sign.outputs.rekor_entry_uuid }}
      rekor_log_index:
        description: Rekor transparency-log entry index.
        value: ${{ jobs.sign.outputs.rekor_log_index }}
      sbom_ref:
        description: >
          OCI referrer descriptor URI for the attached CycloneDX SBOM
          (FT-091 / ADR-059). Identical to the input image_ref by digest;
          consumers resolve the attached SBOM via the referrers API at
          this digest or via `cosign download sbom <ref>`. The
          WorkerImageSubmission's claimed_sbom_ref field carries this URI.
        value: ${{ jobs.sign.outputs.sbom_ref }}

jobs:
  sign:
    name: Cosign keyless sign + Rekor record
    runs-on: ubuntu-latest
    permissions:
      # Required so the Actions runtime can mint an OIDC token for
      # cosign to exchange with Fulcio. Without `id-token: write` cosign
      # falls back to interactive OAuth and the run hangs.
      id-token: write
      contents: read
    outputs:
      signature_subject: ${{ steps.identity.outputs.signature_subject }}
      signature_issuer: ${{ steps.identity.outputs.signature_issuer }}
      rekor_entry_uuid: ${{ steps.sign.outputs.rekor_entry_uuid }}
      rekor_log_index: ${{ steps.sign.outputs.rekor_log_index }}
      sbom_ref: ${{ steps.sbom.outputs.sbom_ref }}
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: ${{ inputs.cosign_version }}

      - name: Verify image reference includes digest
        # Refuse to sign a mutable tag — cosign would otherwise sign
        # whatever bytes the tag currently points at, and that binding
        # can change after the workflow completes. Worker repos MUST
        # resolve the tag to a digest at push time and pass the digest
        # form here.
        run: |
          set -euo pipefail
          case "${{ inputs.image_ref }}" in
            *@sha256:*) echo "OK: image_ref is digest-pinned" ;;
            *) echo "::error::image_ref ${{ inputs.image_ref }} must include @sha256:<digest>"; exit 1 ;;
          esac

      - name: Compute keyless signing identity
        id: identity
        # The cosign keyless flow records the workflow's OIDC subject
        # on the issued Fulcio cert. We pre-compute it here so the
        # workflow's outputs match what cosign will actually record,
        # giving the WorkerImageSubmission a stable identity payload
        # to claim BEFORE the cosign step runs.
        run: |
          set -euo pipefail
          subject="https://github.com/${GITHUB_REPOSITORY}/${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          # GITHUB_WORKFLOW_REF already encodes <owner>/<repo>/<workflow-path>@<ref>;
          # the prefix-strip above keeps the canonical form.
          # Fallback: construct from parts if GITHUB_WORKFLOW_REF is empty.
          if [ -z "${GITHUB_WORKFLOW_REF:-}" ]; then
            subject="https://github.com/${GITHUB_REPOSITORY}/${GITHUB_WORKFLOW}@${GITHUB_REF}"
          else
            subject="https://github.com/${GITHUB_WORKFLOW_REF}"
          fi
          echo "signature_subject=${subject}" >> "$GITHUB_OUTPUT"
          echo "signature_issuer=https://token.actions.githubusercontent.com" >> "$GITHUB_OUTPUT"
          echo "identity: ${subject}"

      - name: Cosign sign --keyless
        id: sign
        env:
          COSIGN_EXPERIMENTAL: "1"
          COSIGN_YES: "true"
        # The actual keyless signing call. `--yes` waives the
        # interactive confirmation; the OIDC token is sourced
        # automatically from the GitHub Actions runtime via the
        # `id-token: write` permission. Output is captured via the
        # `--output-signature` and `--output-certificate` flags so we
        # can attach them as workflow artifacts for FT-090 / FT-094
        # consumption. The Rekor entry UUID + index are parsed from
        # cosign's structured stderr output.
        run: |
          set -euo pipefail
          mkdir -p ./.cosign-out
          cosign sign \
            --yes \
            --rekor-url "${{ inputs.rekor_url }}" \
            --fulcio-url "${{ inputs.fulcio_url }}" \
            --output-signature ./.cosign-out/signature.sig \
            --output-certificate ./.cosign-out/certificate.pem \
            "${{ inputs.image_ref }}" 2>&1 | tee ./.cosign-out/cosign.log

          # cosign prints `tlog entry created with index: <N>` and
          # `tlog entry created with UUID: <UUID>` to stderr (captured
          # into the combined log above by `2>&1`). Parse them out.
          uuid=$(grep -oE 'UUID: [a-f0-9]{64}' ./.cosign-out/cosign.log | tail -n1 | awk '{print $2}' || true)
          index=$(grep -oE 'index: [0-9]+' ./.cosign-out/cosign.log | tail -n1 | awk '{print $2}' || true)

          if [ -z "$uuid" ]; then
            echo "::error::cosign did not report a Rekor entry UUID"
            exit 1
          fi
          if [ -z "$index" ]; then
            echo "::error::cosign did not report a Rekor entry index"
            exit 1
          fi

          echo "rekor_entry_uuid=${uuid}" >> "$GITHUB_OUTPUT"
          echo "rekor_log_index=${index}" >> "$GITHUB_OUTPUT"
          echo "Rekor entry: ${{ inputs.rekor_url }}/api/v1/log/entries/${uuid}"

      - name: Install syft for CycloneDX SBOM generation
        # FT-091 / ADR-059: every worker OCI image carries a CycloneDX
        # SBOM attached as an OCI referrer (OCI v1.1) so the
        # WorkerCurator's bundle can name it and slice-3+ vulnerability
        # gates can fetch it on demand. syft is the reference producer
        # for CycloneDX from container images.
        uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: ${{ inputs.syft_version }}

      - name: Generate CycloneDX SBOM
        id: sbom_generate
        # syft scans the image's filesystem layers and emits a
        # CycloneDX-JSON document covering installed packages, language
        # ecosystems, and OS distros. The file is uploaded as a workflow
        # artifact alongside the cosign output for auditability; cosign
        # attach in the next step is what makes it reachable from the
        # registry.
        run: |
          set -euo pipefail
          mkdir -p ./.sbom-out
          syft "${{ inputs.image_ref }}" \
            --output cyclonedx-json=./.sbom-out/sbom.cyclonedx.json
          # Sanity-check the produced document so a downstream "attach"
          # against an empty file fails fast and surfaces here, not at
          # admission time on the orchestrator side.
          if [ ! -s ./.sbom-out/sbom.cyclonedx.json ]; then
            echo "::error::syft produced an empty CycloneDX SBOM file"
            exit 1
          fi
          if ! head -c 4096 ./.sbom-out/sbom.cyclonedx.json | grep -q '"bomFormat" *: *"CycloneDX"'; then
            echo "::error::syft output does not declare bomFormat=CycloneDX"
            exit 1
          fi
          echo "OK: CycloneDX SBOM generated ($(wc -c < ./.sbom-out/sbom.cyclonedx.json) bytes)"

      - name: Attach SBOM as OCI referrer
        id: sbom
        env:
          COSIGN_EXPERIMENTAL: "1"
          COSIGN_YES: "true"
        # `cosign attach sbom` attaches the CycloneDX document as an OCI
        # artifact whose manifest's subject field points back to the
        # image's digest, per OCI v1.1 referrers. After this step a
        # caller can resolve the SBOM via the registry's referrers API
        # at the image digest, or directly via
        # `cosign download sbom <image-ref>` (which is the discovery
        # path the WorkerCurator bundle relies on per ADR-059).
        #
        # The sbom_ref output is the digest-pinned image reference — the
        # subject ref the referrers API resolves under. The
        # WorkerImageSubmission carries this in claimed_sbom_ref;
        # decision-cli's core::sbom_referrer validator (FT-091) admits
        # it as a syntactically-correct OCI referrer descriptor URI.
        run: |
          set -euo pipefail
          cosign attach sbom \
            --sbom ./.sbom-out/sbom.cyclonedx.json \
            --type cyclonedx \
            "${{ inputs.image_ref }}"
          echo "sbom_ref=${{ inputs.image_ref }}" >> "$GITHUB_OUTPUT"

      - name: Upload cosign signing artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cosign-signing-artifacts
          path: ./.cosign-out/
          if-no-files-found: error
          retention-days: 30

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: ./.sbom-out/
          if-no-files-found: error
          retention-days: 30
